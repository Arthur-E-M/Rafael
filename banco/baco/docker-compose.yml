# =====================================================================
# docker-compose.yml
# Sobe 2 serviços:
#   db      -> PostgreSQL 17 (o banco de dados)
#   pgadmin -> pgAdmin 4 (tela no navegador para ver o banco)
#
# Ligar:     docker compose up -d
# Desligar:  docker compose down
# Recomeçar do zero (apaga os dados): docker compose down -v
# =====================================================================

services:
  db:
    image: postgres:17
    container_name: bd_unipam
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: bd_aula            # banco criado automaticamente
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${PORTA_BANCO:-5432}:5432"   # porta do computador : porta do contêiner
    volumes:
      - dados_postgres:/var/lib/postgresql/data   # onde os dados ficam guardados
      - ./init:/docker-entrypoint-initdb.d:ro     # scripts executados na 1a vez
      - ./consultas:/consultas:ro                 # arquivos de consulta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d bd_aula"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_unipam
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-aluno@exemplo.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_SENHA:-aluno}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PORTA_PGADMIN:-8080}:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro   # servidor já cadastrado
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados_postgres:
